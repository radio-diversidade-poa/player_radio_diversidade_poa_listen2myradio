<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rádio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:transparent;
    font-family:Arial,sans-serif;
}

.radio-banner{
    width:100%;
    background:#7427a9;
    padding:4px 8px;
}

.radio-wrap{
    max-width:1400px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
}

.player-box,
.banner-box{
    flex:1;
    aspect-ratio:4/5;
    border-radius:12px;
    overflow:hidden;
}

.player-box{
    background:#ffffff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    text-align:center;
}

.player-box h2{
    color:#7427a9;
    margin-bottom:20px;
    font-size:24px;
}

audio{
    width:100%;
}

.banner-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

@media(max-width:768px){
    .radio-wrap{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<div class="radio-banner">
    <div class="radio-wrap">

        <div class="player-box">
            <h2>AO VIVO</h2>

            <audio controls autoplay>
                <source src="https://stm1.uniservstm.stream:6732/stream" type="audio/mpeg">
                Seu navegador não suporta áudio.
            </audio>
        </div>

        <div class="banner-box">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh4lgQ9dPqG8VaJt6_2G_i2Fx_o6JfSFTikyzVzbDXGvCz09HjFQymkupoQowqG6YgRMnUTzzS5hWdHtp6Zmk0IDagDl4BzeeBqQK5qfHSzNOPSZCDViT0XlYy-nD51e597v-doNG05rvmKqQmI99BUHGjcpY-MHNV-2_jTmngjaZbZ5W-rUAIKwRY0ue0w/s320/_banner_familia.jpeg" alt="Banner Natal">
        </div>

    </div>
</div>

</body>
</html>
